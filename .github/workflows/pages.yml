name: "Deploy Static Verifier & Spec Portal to GitHub Pages"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: "Export Static index.html & Spec Pages"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24 (Web Crypto Ed25519)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/verifier-sandbox/package-lock.json

      - name: Configure GitHub Pages base path
        id: pages
        uses: actions/configure-pages@v5

      - name: Install, verify interop, typecheck & export static HTML
        working-directory: apps/verifier-sandbox
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_GITHUB_REPO_URL: https://github.com/${{ github.repository }}
        run: |
          npm ci
          npm run verify:interop
          npm run typecheck
          npm run build
          test -f out/.nojekyll
          test -f out/index.html
          test -f out/specs/index.html
          test -f out/schemas/index.html
          test -f out/contribute/index.html

      - name: Upload static HTML artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/verifier-sandbox/out

  deploy:
    name: "Publish to GitHub Pages"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

